<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>GBS_HORIZON_SOCIAL_STORY-TEMPLATE_1080x1920</title>
<link rel="stylesheet" href="../../00_BRAND_CORE/tokens.css">
<link rel="stylesheet" href="../../00_BRAND_CORE/fonts.css">
<link rel="stylesheet" href="../../03_PRINT/_shared/print-base.css">
<style>
  :root { --trim-w: 1080px; --trim-h: 1920px; }
  html, body { background: var(--gbs-offwhite); }
  .page { background: var(--gbs-offwhite); }
  .panel { position: absolute; left: 0; top: 0; width: 1080px; height: 720px; background: var(--gbs-sage); }
  .panel img { position: absolute; left: 50%; top: 290px; width: 520px; transform: translateX(-50%); display: block; }
  .panel .eyebrow { position: absolute; left: 90px; right: 90px; top: 560px; text-align: center; font-size: 20px; color: var(--gbs-offwhite); letter-spacing: 0.18em; }
  .headline { position: absolute; left: 90px; top: 880px; width: 900px; font-family: var(--font-heading); font-weight: 700; font-size: 76px; line-height: 1.1; color: var(--gbs-sage); }
  .support { position: absolute; left: 90px; top: 1230px; width: 900px; font-family: var(--font-body); font-weight: 400; font-size: 34px; line-height: 1.4; color: var(--gbs-ink); }
  .foot { position: absolute; left: 90px; right: 90px; bottom: 300px; height: 52px; border-top: 2px solid var(--gbs-light); }
  .foot .web { position: absolute; left: 0; bottom: -4px; font-family: var(--font-body); font-weight: 600; font-size: 28px; color: var(--gbs-red); }
  .foot .bars { position: absolute; right: 0; bottom: 0; font-size: 48px; }
  .note { position: absolute; left: 90px; top: 760px; width: 900px; font-family: var(--font-body); font-size: 18px; color: var(--gbs-ink-soft); }
</style>
</head>
<body>
<section class="page" data-trim="1080 x 1920 px" aria-label="Story template">
  <div class="panel">
    <img src="../../01_LOGO_MASTER/svg/GBS_HORIZON_LOGO_REVERSED-NOSTRAP_OFFWHITE-RED_v1.0.svg" alt="GBS Property Maintenance">
    <span class="eyebrow">[TOPIC]</span>
  </div>
  <div class="note">Template: replace bracketed text. Top 250 px and bottom 250 px are covered by app controls; keep content clear of them.</div>
  <div class="headline">[Headline]</div>
  <div class="support">[Supporting line]</div>
  <div class="foot">
    <span class="web">{{company.domain}}</span>
    <span class="bars"><i></i><i></i><i></i><i></i></span>
  </div>
</section>
</body>
</html>
