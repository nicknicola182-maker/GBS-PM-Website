<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>GBS_HORIZON_BUSINESS-CARD_A-NAMED_85x55</title>
<link rel="stylesheet" href="../../00_BRAND_CORE/tokens.css">
<link rel="stylesheet" href="../../00_BRAND_CORE/fonts.css">
<link rel="stylesheet" href="../_shared/print-base.css">
<link rel="stylesheet" href="cards.css">
</head>
<body>

<section class="page front" data-trim="85 x 55 mm" aria-label="Business card front (white)">
  <div class="logo"><img src="../../01_LOGO_MASTER/svg/GBS_HORIZON_LOGO_PRIMARY-NOSTRAP_SAGE-RED_v1.0.svg" alt="GBS Property Maintenance"></div>
  <div class="header-rule"></div>
  <div class="person">
    <div class="name">{{company.people.0.name}}</div>
    <div class="role">{{company.people.0.role}}</div>
  </div>
  <div class="contact">
    <div><span class="k">M</span><span class="num">{{company.people.0.mobile}}</span></div>
    <div><span class="k">T</span><span class="num">{{company.phone}}</span></div>
    <div>{{company.people.0.email}}</div>
    <div class="web">{{company.domain}}</div>
  </div>
</section>

<section class="page back sage" data-trim="85 x 55 mm" aria-label="Business card back (solid sage)">
  <div class="bleed"></div>
  <div class="logo-centre"><img src="../../01_LOGO_MASTER/svg/GBS_HORIZON_LOGO_REVERSED-NOSTRAP_OFFWHITE-RED_v1.0.svg" alt="GBS Property Maintenance"></div>
  <span class="strap strap-centre">BUILD <span class="pipe">|</span> MAINTAIN <span class="pipe">|</span> IMPROVE</span>
</section>

</body>
</html>
